[package]
name = "codegen-llvm"
version = "0.3.0"
edition = "2021"
[package.metadata.omni]
project-version = "0.3.0.1"
cargo-semver-base = "0.3.0"
version-scheme = "stable.major.minor.patch"

[dependencies]
lir = { path = "../lir" }

[features]
# Compatibility names retained without pulling an LLVM SDK into the baseline.
