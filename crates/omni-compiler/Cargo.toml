[package]
name = "omni-compiler"
version = "0.2.0"
edition = "2021"
authors = ["Shreyash Jagtap <ssjagtap2016@gmail.com>"]
license = "Apache-2.0"

[lib]
name = "omni_compiler"
path = "src/lib.rs"
[package.metadata.omni]
project-version = "0.2.0.1"
cargo-semver-base = "0.2.0"
version-scheme = "stable.major.minor.patch"

[dependencies]
lir = { path = "../lir" }
codegen-cranelift = { path = "../codegen-cranelift", optional = true, features = ["use_cranelift"] }
codegen-native = { path = "../codegen-native" }
codegen-wasm = { path = "../codegen-wasm", optional = true }
codegen-llvm = { path = "../codegen-llvm", optional = true }
omni-stdlib = { path = "../omni-stdlib" }
thiserror = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Ownership oracle is archived; full ownership checking is a v0.2.0 milestone.
# The borrow checker is now implemented in crates/omni-compiler/src/borrow_check/
# use_ownership_oracle = []  # Archived

# Feature to enable the incremental Salsa-based LSP database and tests
use_salsa_lsp = ["salsa"]
dev-jit = ["dep:codegen-cranelift"]
wasm-backend = ["dep:codegen-wasm"]
use_llvm = ["dep:codegen-llvm"]

[dependencies.salsa]
version = "0.26"
optional = true
features = ["macros"]

[dev-dependencies]
tempfile = "3"