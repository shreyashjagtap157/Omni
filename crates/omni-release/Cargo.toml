[package]
name = "omni-release"
version = "0.3.0"
edition = "2021"

# No dependencies are intentional: the v0.1.4 tool is a fail-closed release
# boundary, not a partial publisher that can be mistaken for a signed release.
[package.metadata.omni]
project-version = "0.3.0.1"
cargo-semver-base = "0.3.0"
version-scheme = "stable.major.minor.patch"

